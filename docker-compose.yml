services:
  backend:
    build: ./backend
    container_name: my-backend
    networks:
      - proxy-network

  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    networks:
      - proxy-network

networks:
  proxy-network:
    driver: bridge