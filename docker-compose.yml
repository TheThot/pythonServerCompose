services:
  backend:
    image: backend:${APP_VERSION}
    build:
      context: ./backend
      args:
        BACKEND_PORT: ${BACKEND_PORT}
    container_name: my-backend
    networks:
      proxy-network:
          ipv4_address: 172.20.3.20
    env_file:
       - .env

  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      proxy-network:
        ipv4_address: 172.20.3.10

networks:
  proxy-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16